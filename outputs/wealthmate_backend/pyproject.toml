[project]
name = "wealthmate-v1-api"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "python-jose[cryptography]>=3.3,<4",
  "httpx>=0.27,<1",
  "apscheduler>=3.10,<4",
  "langgraph>=0.2,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
