services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: wealthmate
      POSTGRES_USER: wealthmate
      POSTGRES_PASSWORD: ${WEALTHMATE_DB_PASSWORD:?Set a unique database password}
    volumes:
      - wealthmate_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wealthmate -d wealthmate"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    depends_on:
      db:
        condition: service_healthy
    environment:
      WEALTHMATE_DATABASE_URL: ${WEALTHMATE_DATABASE_URL:?Set the database URL matching the database password}
      WEALTHMATE_JWT_SECRET: ${WEALTHMATE_JWT_SECRET:?Set a long random JWT secret}
      WEALTHMATE_ENVIRONMENT: beta
      WEALTHMATE_DEMO_ENABLED: "false"
      WEALTHMATE_TEST_SCHEMA_INIT: "false"
      WEALTHMATE_CORS_ORIGINS: ${WEALTHMATE_CORS_ORIGINS:?Set explicit allowed origins}
      APP_GIT_SHA: ${APP_GIT_SHA:-unknown}
    ports:
      - "127.0.0.1:${WEALTHMATE_API_PORT:-18000}:8000"

volumes:
  wealthmate_pgdata:
